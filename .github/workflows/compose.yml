name: Compose Instagram media
on:
  push:
    paths: ["ig/jobs/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: compose
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg (static build)
        run: |
          curl -sSfL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz \
            || curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
          f=$(find /tmp/ff -name ffmpeg -type f | head -1); sudo cp "$f" "$(dirname "$f")/ffprobe" /usr/local/bin/ 2>/dev/null || sudo cp "$f" /usr/local/bin/
          ffmpeg -version | head -1; jq --version
      - name: Compose pending jobs
        run: |
          set -e
          shopt -s nullglob
          for job in ig/jobs/*.json; do
            case "$job" in *.edit.json|*.fetch.json) continue;; esac
            out=$(jq -r .out "$job"); type=$(jq -r .type "$job"); url=$(jq -r .media_url "$job"); ov=$(jq -r .overlay "$job")
            # only Higgsfield's own CDN
            case "$url" in https://d8j0ntlcm91z4.cloudfront.net/*|https://*.higgsfield.ai/*) ;; *) echo "skip $job: url not allowed"; continue;; esac
            if [ "$type" = video ]; then
              [ -f "$out.mp4" ] && continue
              curl -sSfL "$url" -o /tmp/in.mp4
              ffmpeg -y -loglevel error -i /tmp/in.mp4 -loop 1 -i "$ov" -filter_complex \
                "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30[bg];[1:v]format=rgba,fade=in:st=0.3:d=0.7:alpha=1[ov];[bg][ov]overlay=0:0:shortest=1,format=yuv420p[v]" \
                -map "[v]" -map 0:a? -c:v libx264 -preset veryfast -crf 20 -c:a aac -b:a 128k -movflags +faststart "$out.mp4"
              ffmpeg -y -loglevel error -sseof -0.5 -i "$out.mp4" -frames:v 1 -q:v 3 "$out.jpg"
            else
              [ -f "$out.jpg" ] && continue
              curl -sSfL "$url" -o /tmp/in.img
              ffmpeg -y -loglevel error -i /tmp/in.img -i "$ov" -filter_complex \
                "[0:v]scale=1080:1350:force_original_aspect_ratio=increase,crop=1080:1350[bg];[bg][1:v]overlay=0:0" -frames:v 1 -q:v 3 "$out.jpg"
            fi
            echo "made $out"
          done
      - name: Fetch media for review
        run: |
          shopt -s nullglob
          for job in ig/jobs/*.fetch.json; do
            jq -c '.files[]' "$job" | while read -r f; do
              url=$(echo "$f" | jq -r .url); dst=$(echo "$f" | jq -r .to)
              case "$url" in https://d8j0ntlcm91z4.cloudfront.net/*) ;; *) echo "skip $url"; continue;; esac
              [ -f "$dst" ] && continue
              mkdir -p "$(dirname "$dst")"; curl -sSfL "$url" -o "$dst"
            done
          done
      - name: Edit pending Reels
        run: |
          shopt -s nullglob
          for job in ig/jobs/*.edit.json; do
            out=$(jq -r .out "$job")
            [ -f "$out.mp4" ] && continue
            python3 tools/ig/edit.py "$job"
          done
      - name: Commit
        run: |
          git config user.name "lure-bot"; git config user.email "actions@users.noreply.github.com"
          git add ig/ && (git diff --cached --quiet || (git commit -m "Compose Instagram media" && git push))
